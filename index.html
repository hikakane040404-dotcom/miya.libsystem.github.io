<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宮本研 蔵書管理システム - Pro View</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <!-- QR Scanner JS -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --acc: #38bdf8;
            --acc-dark: #0284c7;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --glass: rgba(30, 41, 59, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        h1,
        h2,
        h3,
        .book-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
        }

        /* --- Header --- */
        header {
            background: var(--glass);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            color: var(--acc);
            font-size: 1.2rem;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4));
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        .user-name {
            color: var(--text);
            font-weight: 500;
        }

        .logout-btn {
            color: var(--danger);
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* --- Search Bar --- */
        .search-container {
            padding: 15px 20px;
            position: sticky;
            top: 65px;
            z-index: 90;
            background: var(--bg);
        }

        .search-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text);
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .search-box:focus {
            outline: 2px solid var(--acc);
        }

        /* --- Book List --- */
        .container {
            padding: 0 20px;
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card:active {
            transform: scale(0.97);
        }

        .book-cover-container {
            position: relative;
            padding-top: 140%;
            background: #1a2233;
        }

        .book-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-info {
            padding: 12px;
        }

        .book-title {
            font-size: 0.9rem;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.6em;
        }

        .book-author {
            font-size: 0.75rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .badge-ok {
            background: rgba(34, 197, 94, 0.85);
            color: #fff;
        }

        .badge-ng {
            background: rgba(239, 68, 68, 0.85);
            color: #fff;
        }

        /* --- Tab Bar --- */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            padding-bottom: 15px;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.7rem;
        }

        .tab-item.active {
            color: var(--acc);
        }

        .tab-icon {
            font-size: 1.4rem;
            margin-bottom: 2px;
        }

        /* --- Modals --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            border-radius: 24px;
            padding: 24px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }

        /* --- Forms --- */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 6px;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--acc);
            color: #0f172a;
        }

        .btn-primary:active {
            transform: scale(0.98);
            background: var(--acc-dark);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--acc);
            color: var(--acc);
        }

        .btn-warn {
            background: var(--danger);
            color: #fff;
        }

        /* --- Scanner Area --- */
        #reader,
        #modal-reader {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }

        #scan-overlay,
        #modal-scan-ov {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border: 2px solid var(--acc);
            opacity: 0;
            transition: 0.3s;
            z-index: 101;
            border-radius: 16px;
        }

        #scan-overlay.active,
        #modal-scan-ov.active {
            opacity: 0.4;
        }

        /* --- Toast --- */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--acc);
            color: #0f172a;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            z-index: 2000;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
            top: 40px;
        }

        .loader {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .camera-box {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 4/3;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Auth Page --- */
        #auth-page {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        /* --- Admin Grid --- */
        .admin-section {
            margin-bottom: 30px;
        }

        .admin-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--acc);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .admin-btn {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .admin-btn i {
            font-size: 1.8rem;
            color: var(--acc);
        }

        .photo-area {
            position: relative;
            width: 120px;
            height: 160px;
            background: #0f172a;
            border-radius: 10px;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            margin: 0 auto 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #photo-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .photo-btn {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="toast"></div>

    <!-- 🔐 Authentication Page -->
    <div id="auth-page">
        <div class="auth-card">
            <h1 style="font-size: 2.2rem; margin-bottom: 10px; color: var(--acc); font-family: 'Outfit';">MIYAMOTO LAB
            </h1>
            <p style="color: var(--muted); margin-bottom: 35px; font-weight: 300;">LIBRARY MANAGEMENT SYSTEM</p>

            <div class="auth-tabs">
                <div id="tab-login" class="auth-tab" onclick="switchTab('login')"
                    style="background:var(--acc); color:#0f172a">ログイン</div>
                <div id="tab-reg" class="auth-tab" onclick="switchTab('reg')">新規登録</div>
            </div>

            <div id="form-login">
                <div class="form-group"><input type="text" id="login-id" placeholder="学生番号"></div>
                <div class="form-group"><input type="password" id="login-pass" placeholder="パスワード"></div>
                <button class="btn btn-primary" onclick="doLogin()">ログイン</button>
            </div>

            <div id="form-reg" style="display:none">
                <div class="form-group"><input type="text" id="reg-id" placeholder="学生番号"></div>
                <div class="form-group"><input type="text" id="reg-name" placeholder="お名前"></div>
                <div class="form-group"><input type="password" id="reg-pass" placeholder="初期パスワード"></div>
                <button class="btn btn-primary" onclick="doRegister()">アカウント作成</button>
            </div>
            <p id="auth-err" style="color:var(--danger); font-size:0.85rem; margin-top:20px;"></p>
        </div>
    </div>

    <!-- 📱 Main Application -->
    <header>
        <div class="logo"><b>MIYAMOTO LAB</b> <small style="color:var(--muted); font-weight:300">LIBRARY</small></div>
        <div class="user-info">
            <span class="user-name" id="display-name">Guest</span>
            <button class="logout-btn" onclick="doLogout()">&#10144;</button>
        </div>
    </header>

    <!-- 📊 Contents -->
    <main>
        <!-- 一覧表示 -->
        <div id="view-browse" class="views">
            <div class="search-container">
                <input type="text" id="book-search" class="search-box" placeholder="タイトル、著者、ISBNで検索...">
            </div>
            <div class="container">
                <div id="book-grid" class="book-grid"></div>
            </div>
        </div>

        <!-- スキャン -->
        <div id="view-scan" class="views" style="display:none; padding:20px">
            <div class="camera-box">
                <div id="reader"></div>
                <div id="scan-overlay"></div>
                <div id="cam-start"
                    style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.6); z-index:102;">
                    <span style="font-size:3rem; margin-bottom:15px;">📷</span>
                    <button class="btn btn-primary" style="width:160px" onclick="startScanner()">カメラを起動</button>
                    <div id="cam-err" style="color:var(--danger); font-size:0.85rem; padding:20px; text-align:center">
                    </div>
                </div>
            </div>
            <p style="text-align:center; color:var(--muted); font-size:0.9rem">バーコードを枠に合わせてください</p>
            <div id="scan-result"></div>
        </div>

        <!-- マイページ -->
        <div id="view-mypage" class="views" style="display:none; padding:20px">
            <div class="card" style="padding:25px; margin-bottom:25px">
                <h3 style="color:var(--acc); margin-bottom:10px">Account Status</h3>
                <p id="my-info">Loading...</p>
            </div>
            <h3 style="margin-bottom:15px; font-size:1.1rem">利用履歴</h3>
            <div id="my-history"></div>
        </div>

        <!-- 管理 -->
        <div id="view-admin" class="views" style="display:none; padding:20px">
            <div class="admin-section">
                <h3 class="admin-title"><span>📚</span> 蔵書管理</h3>
                <div class="admin-grid">
                    <div class="admin-btn" onclick="openAddModal()"><i>&#10010;</i><span>個別登録</span></div>
                    <div class="admin-btn" onclick="openBulkModal()"><i>&#10064;</i><span>一括スキャン</span></div>
                </div>
            </div>
            <div class="admin-section">
                <h3 class="admin-title"><span>⚙️</span> システム設定</h3>
                <div class="admin-grid">
                    <div class="admin-btn"><i>&#9881;</i><span>設定</span></div>
                    <div class="admin-btn" onclick="updateBooksSync()"><i>&#8635;</i><span>データ同期</span></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 📑 Tab Navigation -->
    <nav class="tab-bar">
        <div class="tab-item active" onclick="showView('browse')" id="t-browse"><span
                class="tab-icon">&#128214;</span><span>一覧</span></div>
        <div class="tab-item" onclick="showView('scan')" id="t-scan"><span
                class="tab-icon">&#128247;</span><span>スキャン</span></div>
        <div class="tab-item" onclick="showView('mypage')" id="t-mypage"><span
                class="tab-icon">&#128100;</span><span>マイページ</span></div>
        <div class="tab-item" onclick="showView('admin')" id="t-admin" style="display:none"><span
                class="tab-icon">&#9881;</span><span>管理</span></div>
    </nav>

    <!-- 🪟 Modals -->
    <!-- 詳細/貸出モーダル -->
    <div id="detail-modal" class="overlay" onclick="if(event.target===this)closeDetail()">
        <div class="modal">
            <h2 id="d-title" style="margin-bottom:15px; font-size:1.3rem"></h2>
            <div style="display:flex; gap:20px; margin-bottom:20px">
                <img id="d-cover"
                    style="width:110px; height:150px; border-radius:10px; object-fit:cover; background:#1a2233">
                <div style="flex:1; font-size:0.85rem; color:var(--muted)">
                    <p style="margin-bottom:6px"><b>著者:</b> <span id="d-author"></span></p>
                    <p style="margin-bottom:6px"><b>ISBN:</b> <span id="d-isbn"></span></p>
                    <p><b>状態:</b> <span id="d-status"></span></p>
                </div>
            </div>
            <p id="d-desc"
                style="font-size:0.85rem; color:var(--muted); margin-bottom:20px; max-height:100px; overflow-y:auto; line-height:1.5">
            </p>
            <div id="d-actions"></div>
        </div>
    </div>

    <!-- 書籍登録モーダル -->
    <div id="book-modal" class="overlay" onclick="if(event.target===this)this.style.display='none'">
        <div class="modal">
            <h2 id="modal-ttl" style="margin-bottom:20px">蔵書登録</h2>
            <form id="book-form">
                <input type="hidden" id="f-id">
                <div class="form-group">
                    <div class="photo-area">
                        <img id="photo-preview">
                        <span id="photo-placeholder">📸 写真</span>
                        <input type="file" id="f-file" accept="image/*" capture="environment" class="photo-btn"
                            onchange="handlePhotoSelect(this)">
                    </div>
                </div>
                <div class="form-group"><label>ISBN</label>
                    <div style="display:flex; gap:8px">
                        <input type="text" id="f-isbn" placeholder="978...">
                        <button type="button" class="btn btn-outline" style="width:60px; padding:0"
                            onclick="startModalScan()">📷</button>
                    </div>
                </div>
                <!-- ISBNスキャンエリア (モーダル内) -->
                <div id="modal-scan-area" style="display:none; margin-bottom:20px; position:relative">
                    <div id="modal-reader"></div>
                    <div id="modal-scan-ov"></div>
                    <button type="button" class="btn btn-warn" style="margin-top:10px"
                        onclick="stopModalScan()">停止</button>
                </div>
                <div class="form-group"><label>タイトル</label><input type="text" id="f-title" required></div>
                <div class="form-group"><label>著者</label><input type="text" id="f-author"></div>
                <div class="form-group"><label>出版社</label><input type="text" id="f-pub"></div>
                <button type="submit" class="btn btn-primary">保存する</button>
            </form>
        </div>
    </div>

    <!-- 一括登録モーダル -->
    <div id="bulk-modal" class="overlay">
        <div class="modal">
            <h2 style="margin-bottom:15px">一括バーコードスキャン</h2>
            <p style="font-size:0.8rem; color:var(--muted); margin-bottom:20px">連続でバーコードをスキャンできます。</p>
            <div id="bulk-scan-area" class="camera-box">
                <div id="bulk-reader"></div>
            </div>
            <div id="bulk-list"
                style="max-height:150px; overflow-y:auto; background:rgba(0,0,0,0.2); border-radius:10px; padding:10px; margin-bottom:20px; font-size:0.85rem">
                <p style="color:var(--muted); text-align:center">スキャンしたISBNがここに並びます</p>
            </div>
            <div style="display:flex; gap:10px">
                <button class="btn btn-primary" style="flex:2" onclick="processBulk()">登録を確定する</button>
                <button class="btn btn-outline" style="flex:1" onclick="closeBulkModal()">閉じる</button>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // 🚨 CONFIG (GASのURLをここに貼る)
        // ========================================
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzEX8Orp-JlL-62Mcxyw5BaDWsrdHQzNod8UTZy5YoY86M9V3fhxbYOH0CV095zP-8AYw/exec";

        // ========================================
        // 🛠️ API Client
        // ========================================
        async function callGAS(command, data = {}) {
            try {
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ command, data })
                });
                return await response.json();
            } catch (err) {
                console.error("API Error:", err);
                toast("通信エラーが発生しました");
                return { success: false, message: err.toString() };
            }
        }

        // ========================================
        // ─── State ───
        var me = null, books = [], curView = 'browse';
        var qr = null, scanning = false, mqr = null, bqr = null;
        var photoB64 = null;
        var bulkScanList = [];

        // ─── Init ───
        window.addEventListener('DOMContentLoaded', async function () {
            // ローカルストレージからログイン情報を復元
            const savedUser = localStorage.getItem('lib_user');
            if (savedUser) {
                me = JSON.parse(savedUser);
                setupUIForUser();
                await refreshData();
            }

            document.getElementById('book-search').addEventListener('input', function (e) { renderBooks(e.target.value); });
            document.getElementById('book-form').addEventListener('submit', onFormSubmit);

            // ISBN自動補完
            document.getElementById('f-isbn').addEventListener('change', async function (e) {
                const isbn = e.target.value.trim();
                if (isbn.length >= 10) {
                    toast("書籍情報を検索中...");
                    const res = await callGAS("lookupISBN", { isbn });
                    if (res && res.items && res.items.length > 0) {
                        const info = res.items[0].volumeInfo;
                        document.getElementById('f-title').value = info.title || '';
                        document.getElementById('f-author').value = (info.authors || []).join(', ');
                        document.getElementById('f-pub').value = info.publisher || '';
                        if (info.imageLinks && info.imageLinks.thumbnail) {
                            photoB64 = info.imageLinks.thumbnail;
                            const prev = document.getElementById('photo-preview');
                            prev.src = photoB64;
                            prev.style.display = 'block';
                            document.getElementById('photo-placeholder').style.display = 'none';
                        }
                    }
                }
            });
        });

        async function refreshData() {
            const res = await callGAS("getInitialData");
            if (res.books) {
                books = res.books;
                renderBooks();
            }
        }

        function setupUIForUser() {
            document.getElementById('auth-page').style.display = 'none';
            document.getElementById('display-name').textContent = me.name;
            if (me.role === 'admin') {
                document.getElementById('t-admin').style.display = 'flex';
            }
        }

        // ─── Auth ───
        function switchTab(mode) {
            const isL = mode === 'login';
            document.getElementById('form-login').style.display = isL ? 'block' : 'none';
            document.getElementById('form-reg').style.display = isL ? 'none' : 'block';
            document.getElementById('tab-login').style.cssText = isL ? 'background:var(--acc); color:#0f172a' : '';
            document.getElementById('tab-reg').style.cssText = isL ? '' : 'background:var(--acc); color:#0f172a';
        }

        async function doLogin() {
            const id = document.getElementById('login-id').value.trim();
            const password = document.getElementById('login-pass').value;
            if (!id || !password) return alert("入力してください");

            const btn = document.querySelector('#form-login .btn');
            btn.innerHTML = '<div class="loader"></div>';

            const res = await callGAS("login", { id, password });
            if (res.success) {
                me = res.user;
                localStorage.setItem('lib_user', JSON.stringify(me));
                setupUIForUser();
                await refreshData();
            } else {
                document.getElementById('auth-err').textContent = res.message;
                btn.textContent = 'ログイン';
            }
        }

        async function doRegister() {
            const data = {
                id: document.getElementById('reg-id').value.trim(),
                name: document.getElementById('reg-name').value.trim(),
                password: document.getElementById('reg-pass').value
            };
            if (!data.id || !data.name || !data.password) return alert("入力してください");

            const res = await callGAS("registerUser", data);
            if (res.success) {
                toast("登録完了！ログインしてください");
                switchTab('login');
            } else {
                alert(res.message);
            }
        }

        function doLogout() {
            localStorage.removeItem('lib_user');
            location.reload();
        }

        // ─── UI ───
        function showView(view) {
            curView = view;
            document.querySelectorAll('.views').forEach(v => v.style.display = 'none');
            document.getElementById('view-' + view).style.display = 'block';
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById('t-' + view).classList.add('active');

            if (view === 'mypage') renderHistory();
            if (view !== 'scan') stopScanner();
        }

        function renderBooks(q = '') {
            const grid = document.getElementById('book-grid');
            grid.innerHTML = '';
            const filtered = books.filter(b =>
                b.title.toLowerCase().includes(q.toLowerCase()) ||
                b.isbn.includes(q) ||
                b.author.toLowerCase().includes(q.toLowerCase())
            );

            filtered.forEach(b => {
                const ok = b.status === 'available';
                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => openDetail(b);
                div.innerHTML = `
                    <div class="book-cover-container">
                        <img src="${b.thumbnail || 'https://via.placeholder.com/150x210?text=No+Image'}" class="book-cover">
                        <div class="badge ${ok ? 'badge-ok' : 'badge-ng'}">${ok ? '貸出可' : '貸出中'}</div>
                    </div>
                    <div class="book-info">
                        <div class="book-title">${b.title}</div>
                        <div class="book-author">${b.author}</div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function openDetail(b) {
            const ok = b.status === 'available';
            document.getElementById('d-title').textContent = b.title;
            document.getElementById('d-cover').src = b.thumbnail || '';
            document.getElementById('d-author').textContent = b.author;
            document.getElementById('d-isbn').textContent = b.isbn;
            document.getElementById('d-status').textContent = ok ? '貸出可' : '貸出中';
            document.getElementById('d-desc').textContent = b.description || '';

            const actions = document.getElementById('d-actions');
            actions.innerHTML = '';

            if (ok) {
                actions.innerHTML = `<button class="btn btn-primary" onclick="processBorrow('${b.id}')">この本を借りる</button>`;
            } else if (me && String(b.borrower_id) === String(me.id)) {
                actions.innerHTML = `<button class="btn btn-warn" onclick="processReturn('${b.id}')">この本を返却する</button>`;
            } else {
                actions.innerHTML = `<button class="btn btn-outline" onclick="processReserve('${b.id}')">予約する</button>`;
            }

            // 管理者の場合は「編集」ボタンを追加
            if (me && me.role === 'admin') {
                const editBtn = document.createElement('button');
                editBtn.className = 'btn btn-outline';
                editBtn.style.marginTop = '10px';
                editBtn.innerHTML = '⚙️ 書誌情報を修正する';
                editBtn.onclick = () => openEditModal(b);
                actions.appendChild(editBtn);
            }

            document.getElementById('detail-modal').style.display = 'flex';
        }

        function closeDetail() { document.getElementById('detail-modal').style.display = 'none'; }

        async function processBorrow(id) {
            toast("処理中...");
            const res = await callGAS("borrowBook", { id, uid: me.id });
            if (res.success) {
                toast("貸出完了！");
                closeDetail();
                await refreshData();
            }
        }

        async function processReturn(id) {
            toast("処理中...");
            const res = await callGAS("returnBook", { id, uid: me.id });
            if (res.success) {
                toast("返却完了！");
                closeDetail();
                await refreshData();
            }
        }

        // ─── Scanner ───
        function startScanner() {
            document.getElementById('cam-start').style.display = 'none';
            qr = new Html5Qrcode("reader");
            qr.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (code) => {
                handleScanSuccess(code);
            }).catch(err => {
                document.getElementById('cam-err').textContent = "カメラエラー: " + err;
                document.getElementById('cam-start').style.display = 'flex';
            });
        }

        function stopScanner() {
            if (qr) { qr.stop().then(() => qr.clear()); qr = null; }
            document.getElementById('cam-start').style.display = 'flex';
        }

        function handleScanSuccess(code) {
            const b = books.find(x => String(x.isbn) === String(code) || String(x.id) === String(code));
            if (b) {
                openDetail(b);
                stopScanner();
            } else {
                toast("未登録のコードです: " + code);
            }
        }

        // ─── Admin Tools ───
        function openAddModal() {
            document.getElementById('modal-ttl').textContent = '蔵書登録';
            document.getElementById('book-form').reset();
            document.getElementById('f-id').value = '';
            photoB64 = null;
            document.getElementById('photo-preview').style.display = 'none';
            document.getElementById('photo-placeholder').style.display = 'block';
            document.getElementById('book-modal').style.display = 'flex';
        }

        function openEditModal(b) {
            document.getElementById('modal-ttl').textContent = '書誌情報の修正';
            document.getElementById('book-modal').style.display = 'flex';
            document.getElementById('f-id').value = b.id;
            document.getElementById('f-isbn').value = b.isbn || '';
            document.getElementById('f-title').value = b.title || '';
            document.getElementById('f-author').value = b.author || '';
            document.getElementById('f-pub').value = b.publisher || '';

            photoB64 = b.thumbnail;
            const prev = document.getElementById('photo-preview');
            if (photoB64) {
                prev.src = photoB64;
                prev.style.display = 'block';
                document.getElementById('photo-placeholder').style.display = 'none';
            } else {
                prev.style.display = 'none';
                document.getElementById('photo-placeholder').style.display = 'block';
            }
            closeDetail();
        }

        async function updateBooksSync() {
            toast("データを同期中...");
            await refreshData();
            toast("最新の状態に更新しました");
        }

        function handlePhotoSelect(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                photoB64 = e.target.result;
                const prev = document.getElementById('photo-preview');
                prev.src = photoB64;
                prev.style.display = 'block';
                document.getElementById('photo-placeholder').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        async function onFormSubmit(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.innerHTML = '<div class="loader"></div>';

            const id = document.getElementById('f-id').value;
            const data = {
                id: id,
                isbn: document.getElementById('f-isbn').value,
                title: document.getElementById('f-title').value,
                author: document.getElementById('f-author').value,
                publisher: document.getElementById('f-pub').value,
                thumbnail: photoB64
            };

            if (photoB64 && photoB64.startsWith('data:image')) {
                const imgRes = await callGAS("saveImageToDrive", { base64: photoB64, title: data.title });
                if (imgRes.success) data.thumbnail = imgRes.url;
            }

            const command = id ? "updateBook" : "addBook";
            const res = await callGAS(command, data);

            if (res.success) {
                toast(id ? "更新しました" : "登録しました");
                document.getElementById('book-modal').style.display = 'none';
                await refreshData();
            } else {
                alert("エラー: " + res.message);
            }
            btn.textContent = originalText;
        }

        function startModalScan() {
            document.getElementById('modal-scan-area').style.display = 'block';
            mqr = new Html5Qrcode("modal-reader");
            mqr.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (code) => {
                document.getElementById('f-isbn').value = code;
                document.getElementById('f-isbn').dispatchEvent(new Event('change'));
                stopModalScan();
            });
        }
        function stopModalScan() {
            if (mqr) { mqr.stop().then(() => mqr.clear()); mqr = null; }
            document.getElementById('modal-scan-area').style.display = 'none';
        }

        function openBulkModal() {
            bulkScanList = [];
            document.getElementById('bulk-list').innerHTML = '';
            document.getElementById('bulk-modal').style.display = 'flex';
            bqr = new Html5Qrcode("bulk-reader");
            bqr.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (code) => {
                if (!bulkScanList.includes(code)) {
                    bulkScanList.push(code);
                    const p = document.createElement('div');
                    p.style.padding = '5px';
                    p.textContent = '✔️ ' + code;
                    document.getElementById('bulk-list').appendChild(p);
                    toast("スキャン: " + code);
                }
            });
        }

        function closeBulkModal() {
            if (bqr) { bqr.stop().then(() => bqr.clear()); bqr = null; }
            document.getElementById('bulk-modal').style.display = 'none';
        }

        async function processBulk() {
            if (bulkScanList.length === 0) return alert("スキャンしてください");
            toast("書籍情報を取得中...");
            const booksToRegister = [];
            for (const isbn of bulkScanList) {
                const info = await callGAS("lookupISBNForBulk", { isbn });
                if (info && !info.error) {
                    booksToRegister.push({
                        isbn: info.isbn,
                        title: info.title,
                        author: info.author,
                        publisher: info.publisher,
                        publishedDate: info.publishedDate,
                        thumbnail: info.cover
                    });
                }
            }
            const res = await callGAS("addBooksBulk", booksToRegister);
            if (res.success) {
                toast(res.added + "冊の登録を完了しました！");
                closeBulkModal();
                await refreshData();
            }
        }

        async function renderHistory() {
            const histDiv = document.getElementById('my-history');
            histDiv.innerHTML = '<div class="loader"></div>';
            document.getElementById('my-info').textContent = `${me.name} (${me.id})`;

            const res = await callGAS("getUserHistory", { uid: me.id });
            if (res.success && res.history) {
                histDiv.innerHTML = '';
                if (res.history.length === 0) {
                    histDiv.innerHTML = '<p style="color:var(--muted); text-align:center">履歴はありません</p>';
                    return;
                }
                res.history.forEach(h => {
                    const row = document.createElement('div');
                    row.style.background = 'rgba(255,255,255,0.03)';
                    row.style.padding = '12px';
                    row.style.borderRadius = '10px';
                    row.style.marginBottom = '10px';
                    row.style.fontSize = '0.85rem';
                    const date = new Date(h.timestamp).toLocaleDateString();
                    row.innerHTML = `
                        <div style="display:flex; justify-content:space-between; margin-bottom:4px">
                            <span style="color:var(--acc); font-weight:600">${h.action === 'borrow' ? '貸出' : '返却'}</span>
                            <span style="color:var(--muted)">${date}</span>
                        </div>
                        <div>${h.book_title}</div>
                    `;
                    histDiv.appendChild(row);
                });
            }
        }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

    </script>
</body>

</html>
